# Render deployment blueprint for the Bloomberg-style terminal (server.py + index.html).
# Render reads this file automatically when you create a "Blueprint" from the repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bloomberg-terminal
    runtime: python
    # "free" sleeps after ~15 min idle (first hit afterward takes ~50s to wake).
    # Change to "starter" (~$7/mo) to keep it always-on for your boss. Nothing
    # else needs to change.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    # NOTE: No healthCheckPath on purpose. With one set, Render does a strict 5s
    # HTTP GET on "/" every few seconds and RESTARTS the instance if it times out.
    # On the free 0.1-CPU plan, heavy endpoints (e.g. /morning-brief fanning out to
    # many yfinance calls) spike the CPU long enough to miss that 5s window, which
    # triggered restart-flapping + 502s. Omitting it makes Render use a lenient
    # port-open check instead, so a busy-but-alive instance is left running.
    # Once on the Starter plan (more CPU), you can re-add `healthCheckPath: /`.
    envVars:
      # Pinned for reliable binary wheels (curl_cffi / numpy / pandas). The app
      # runs on 3.14 locally, but 3.12 has the broadest wheel coverage on Render.
      - key: PYTHON_VERSION
        value: 3.12.8
      # sync: false  → Render will NOT read these from the repo. Whoever deploys
      # types them into the Render dashboard once (Environment tab). Keeps secrets
      # out of git. See HANDOFF.md for where to get the keys.
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
